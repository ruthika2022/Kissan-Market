<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - Kissan Market</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/vendor.css" />
    <link rel="stylesheet" href="../../css/chat.css" />
    <style>
      .search-bar {
        background: white;
        padding: 1.5rem;
        border-radius: 15px;
        box-shadow: var(--card-shadow);
        margin-bottom: 2rem;
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .search-bar input {
        flex-grow: 1;
        padding: 0.8rem 1rem;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
      }
      .marketplace-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 2rem;
      }
      .bid-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .bid-modal.active {
        display: flex;
      }
      .bid-modal-content {
        background: white;
        padding: 2.5rem;
        border-radius: 20px;
        width: 90%;
        max-width: 450px;
        position: relative;
      }
      @media (max-width: 600px) {
        .search-bar {
          flex-direction: column;
          padding: 1rem;
        }
        .search-bar input,
        .search-bar select,
        .search-bar button {
          width: 100%;
        }
        .bid-modal-content {
          padding: 1.5rem;
          border-radius: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="sidebar">
        <a href="dashboard.html" class="sidebar-logo">
          <span>🚚 Kissan Market</span>
        </a>

        <ul class="sidebar-menu">
          <li class="menu-item">
            <a href="dashboard.html" class="menu-link"> <i>📊</i> Dashboard </a>
          </li>

          <li class="menu-item">
            <a href="marketplace.html" class="menu-link">
              <i>🛒</i> Market place
            </a>
          </li>

          <li class="menu-item">
            <a href="marketprice.html" class="menu-link active">
              <i>📈</i> Market Price
            </a>
          </li>

          <li class="menu-item">
            <a href="my-bids.html" class="menu-link"> <i>⚖️</i> My Bids </a>
          </li>

          <li class="menu-item">
            <a href="notifications.html" class="menu-link">
              <i>🔔</i> Notifications
            </a>
          </li>

          <li class="menu-item">
            <a href="profile.html" class="menu-link"> <i>👤</i> My Profile </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a href="../../index.html" class="menu-link" onclick="State.logout()">
            <i>🚪</i> Logout
          </a>
        </div>
      </aside>

      <main class="main-content">
        <header class="header">
          <div class="header-left"><h2>Marketplace</h2></div>
          <div class="header-right">
            <div class="user-profile"><div class="avatar">V</div></div>
          </div>
        </header>

        <div class="container fade-in">
          <div class="search-bar">
            <input
              type="text"
              placeholder="Search vegetables, fruits or farmers..."
            />
            <button class="btn btn-primary">Search</button>
            <select class="btn btn-outline" style="padding: 0.7rem">
              <option>All Types</option>
              <option>Vegetables</option>
              <option>Fruits</option>
            </select>
          </div>

          <div id="marketplace-list" class="marketplace-grid"></div>

          <div
            id="empty-market"
            style="text-align: center; padding: 4rem; display: none"
          >
            <div style="font-size: 4rem; margin-bottom: 1rem">📭</div>
            <h3>No products available</h3>
            <p style="color: var(--text-muted)">
              Check back later for new arrivals from farmers.
            </p>
          </div>
        </div>
      </main>
    </div>

    <div class="bid-modal" id="bid-modal">
      <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem">
        <h3>Place Your Bid</h3>
        <p
          id="bid-product-info"
          style="margin-bottom: 1.5rem; color: var(--text-muted)"
        ></p>
        <form id="bid-form">
          <input type="hidden" id="bid-product-id" />
          <input type="hidden" id="bid-farmer-id" />
          <input type="hidden" id="bid-farmer-name" />
          <input type="hidden" id="bid-max-price" />
          <input type="hidden" id="bid-product-name" />

          <div class="form-group">
            <label>Your Bid Amount (₹) per kg</label>
            <input
              type="number"
              id="bid-amount"
              required
              style="
                width: 100%;
                padding: 0.8rem;
                margin-top: 0.5rem;
                border: 1px solid #ddd;
                border-radius: 10px;
              "
            />
          </div>
          <div
            style="
              display: flex;
              gap: 1rem;
              margin-top: 2rem;
              justify-content: flex-end;
            "
          >
            <button
              type="button"
              class="btn btn-outline"
              onclick="closeBidModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Submit Bid</button>
          </div>
        </form>
      </div>
    </div>

    <!-- =========================
     DETAILS MODAL (FIXED SINGLE VERSION)
========================= -->
    <div class="bid-modal" id="details-modal">
      <div class="bid-modal-content">
        <h3 id="detail-name"></h3>

        <img
          id="detail-image"
          style="
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin: 10px 0;
          "
        />

        <p id="detail-farmer"></p>
        <p id="detail-location"></p>
        <p id="detail-category"></p>
        <p id="detail-quantity"></p>
        <p id="detail-price"></p>

        <div style="text-align: right; margin-top: 1rem">
          <button class="btn btn-outline" onclick="closeDetails()">
            Close
          </button>
        </div>
      </div>
    </div>
    <!-- CHAT ICON -->

    <div class="chat-icon" id="chatIcon">💬</div>

    <!-- CHAT BOX -->

    <div class="chat-container" id="chatContainer">
      <!-- HEADER -->

      <div class="chat-header">
        <h3 class="c-box">Customer Care</h3>

        <span id="closeChat"> ✖ </span>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="admin-msg">👋 Hello! How can we help you?</div>
      </div>

      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type message..." />

        <button id="sendBtn">Send</button>
      </div>
    </div>

    <script src="../../js/chat.js"></script>

    <script src="../../js/app.js"></script>
    <script src="../../js/vendor.js"></script>
    <script>
      // ===============================
      // SAMPLE PRODUCTS
      // ===============================

      if (!localStorage.getItem("products")) {
        const sampleProducts = [
          {
            id: 1,
            name: "Fresh Tomatoes",
            farmerId: 101,
            farmerName: "Ramesh Farmer",
            category: "Vegetables",
            quantity: 50,
            unit: "Kg",
            minPrice: 1200,
            location: "Hyderabad",
            status: "Active",
            endTime: new Date().getTime() + 86400000,
            image:
              "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=600",
          },

          {
            id: 2,
            name: "Organic Apples",
            farmerId: 102,
            farmerName: "Suresh Farms",
            category: "Fruits",
            quantity: 30,
            unit: "Kg",
            minPrice: 2500,
            location: "Warangal",
            status: "Active",
            endTime: new Date().getTime() + 172800000,
            image:
              "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=600",
          },

          {
            id: 3,
            name: "Green Chillies",
            farmerId: 103,
            farmerName: "Lakshmi Agro",
            category: "Vegetables",
            quantity: 20,
            unit: "Kg",
            minPrice: 900,
            location: "Karimnagar",
            status: "Active",
            endTime: new Date().getTime() + 259200000,
            image:
              "https://images.unsplash.com/photo-1588252303782-cb80119abd6d?w=600",
          },

          {
            id: 4,
            name: "Bananas",
            farmerId: 104,
            farmerName: "Green Valley",
            category: "Fruits",
            quantity: 100,
            unit: "Dozen",
            minPrice: 1800,
            location: "Nizamabad",
            status: "Active",
            endTime: new Date().getTime() + 86400000,
            image:
              "https://images.unsplash.com/photo-1574226516831-e1dff420e37f?w=600",
          },

          {
            id: 5,
            name: "Potatoes",
            farmerId: 105,
            farmerName: "Village Crops",
            category: "Vegetables",
            quantity: 80,
            unit: "Kg",
            minPrice: 1500,
            location: "Adilabad",
            status: "Active",
            endTime: new Date().getTime() + 432000000,
            image:
              "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=600",
          },

          {
            id: 6,
            name: "Mangoes",
            farmerId: 106,
            farmerName: "Nature Fresh",
            category: "Fruits",
            quantity: 40,
            unit: "Kg",
            minPrice: 3200,
            location: "Khammam",
            status: "Active",
            endTime: new Date().getTime() + 345600000,
            image:
              "https://images.unsplash.com/photo-1553279768-865429fa0078?w=600",
          },
        ];

        // Ensure every product has a sensible maxPrice = 1.3x minPrice when missing
        sampleProducts.forEach((p) => {
          p.minPrice = Number(p.minPrice) || 0;
          p.maxPrice = p.maxPrice
            ? Number(p.maxPrice)
            : Math.round(p.minPrice * 1.3);
        });

        localStorage.setItem("products", JSON.stringify(sampleProducts));
      }

      // ===============================
      // OPEN BID MODAL
      // ===============================

      function openBidModal(
        id,
        farmerId,
        farmerName,
        name,
        minPrice,
        maxPrice,
      ) {
        const product = State.getProducts().find((p) => p.id === id);

        if (!product || product.status !== "Active") {
          UI.showToast("Bidding is closed for this product", "error");
          return;
        }

        const highestBid = State.getHighestBid(id);

        document.getElementById("bid-product-id").value = id;
        document.getElementById("bid-farmer-id").value = farmerId;
        document.getElementById("bid-farmer-name").value = farmerName;
        document.getElementById("bid-product-name").value = name;

        const currentHighest = highestBid ? highestBid.amount : minPrice;


        const perUnit =
          product && product.quantity
            ? Math.round((minPrice || 0) / product.quantity)
            : null;

        const maxPerUnit =
          product && product.quantity && maxPrice
            ? Math.round(maxPrice / product.quantity)
            : null;

        // Ensure numeric fallbacks; default maxPrice to 1.3x minPrice
        minPrice = Number(minPrice) || 0;
        maxPrice = Number(maxPrice) || Math.round(minPrice * 1.3);

        document.getElementById("bid-product-info").innerHTML = `
  Bidding for <strong>${name}</strong><br>

  Minimum Price: ₹${minPrice}
  ${perUnit ? `(₹${perUnit} per ${product.unit})` : ""}<br>

  Maximum Price: ₹${maxPrice}
  ${maxPerUnit ? `(₹${maxPerUnit} per ${product.unit})` : ""}<br>

  Current Highest Bid: <strong>₹${currentHighest}</strong> per kg
`;

        const bidAmountEl = document.getElementById("bid-amount");
        bidAmountEl.min = currentHighest + 1;

        // set max attribute if available
        document.getElementById("bid-max-price").value = maxPrice;
        if (maxPrice) bidAmountEl.max = maxPrice;

        // default value: just above current highest but not exceeding maxPrice
        let defaultAmount = currentHighest + 100;
        if (bidAmountEl.max)
          defaultAmount = Math.min(defaultAmount, Number(bidAmountEl.max));
        bidAmountEl.value = defaultAmount;

        document.getElementById("bid-modal").classList.add("active");
      }

      // ===============================
      // CLOSE BID MODAL
      // ===============================

      function closeBidModal() {
        document.getElementById("bid-modal").classList.remove("active");
      }

      // ===============================
      // INTERESTED PRODUCTS
      // ===============================

      function toggleInterested(productId) {
        const added = State.addToInterested(productId);

        if (added) {
          UI.showToast("Added to Interested List", "success");
        } else {
          let interested = State.getInterested();

          interested = interested.filter((id) => id !== productId);

          State.saveData(State.keys.interested, interested);

          UI.showToast("Removed from Interested List", "success");
        }

        renderMarketplace(searchInput.value, categorySelect.value);
      }

      // ===============================
      // RENDER MARKETPLACE
      // ===============================

      function renderMarketplace(
        searchQuery = "",
        categoryFilter = "All Types",
      ) {
        let products = State.getProducts();

        const list = document.getElementById("marketplace-list");

        const empty = document.getElementById("empty-market");

        const user = State.getCurrentUser();

        // SHOW ONLY ACTIVE PRODUCTS

        products = products.filter((p) => p.status === "Active");

        // SEARCH FILTER

        if (searchQuery) {
          const query = searchQuery.toLowerCase();

          products = products.filter(
            (p) =>
              p.name.toLowerCase().includes(query) ||
              p.farmerName.toLowerCase().includes(query) ||
              p.category.toLowerCase().includes(query),
          );
        }

        // CATEGORY FILTER

        if (categoryFilter !== "All Types") {
          products = products.filter((p) => p.category === categoryFilter);
        }

        // EMPTY PRODUCTS

        if (products.length === 0) {
          empty.style.display = "block";
          list.innerHTML = "";
          return;
        }

        empty.style.display = "none";

        // PRODUCT CARDS

        list.innerHTML = products
          .map((p) => {
            const highestBid = State.getHighestBid(p.id);

            const timeLeft = UI.formatTimeLeft(p.endTime);

            const isInterested = State.getInterested().includes(p.id);

            const myBid = State.getBids().find(
              (b) => b.productId === p.id && b.vendorId === user.id,
            );

            let bidStatusBadge = "";

            if (myBid) {
              const isWinning = highestBid && highestBid.vendorId === user.id;

              bidStatusBadge = isWinning
                ? `
          <span class="product-badge"
        
          </span>
        `
                : `
         
        `;
            }

            return `
      <div class="card fade-in"
      style="
      padding:0;
      overflow:hidden;
      border:none;
      transition:0.3s;
      ">

        <div style="
        height:180px;
        position:relative;
        ">

          <img
            src="${p.image}"
            alt="${p.name}"
            style="
            width:100%;
            height:100%;
            object-fit:cover;
            "
          >

          <div style="
          position:absolute;
          top:10px;
          right:10px;
          ">
            <span class="product-badge"
            style="
            background:rgba(255,255,255,0.9);
            color:#333;
            ">
            ⌛ ${timeLeft}
            </span>
          </div>



        </div>

        <div style="padding:1.5rem;">

          <div style="
          display:flex;
          justify-content:space-between;
          margin-bottom:0.5rem;
          ">

            <div>
              <h4 style="margin:0;">
                ${p.name}
              </h4>

              <p style="
              font-size:0.8rem;
              color:var(--text-muted);
              margin:0.2rem 0;
              ">
              👨‍🌾 ${p.farmerName}
              </p>
            </div>

            ${bidStatusBadge}

          </div>

          <p style="
          font-size:0.85rem;
          color:#666;
          margin-bottom:1rem;
          ">
          📍 ${p.location}
          </p>

          <div style="
          display:flex;
          gap:0.5rem;
          margin-bottom:1rem;
          ">

            <span style="
            font-size:0.75rem;
            padding:0.2rem 0.6rem;
            background:#f0f0f0;
            border-radius:4px;
            ">
            ${p.category}
            </span>

            <span style="
            font-size:0.75rem;
            padding:0.2rem 0.6rem;
            background:#f0f0f0;
            border-radius:4px;
            ">
            ${p.quantity} ${p.unit}
            </span>

          </div>

          <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:0.8rem;
          background:var(--secondary-color);
          border-radius:8px;
          margin-bottom:1rem;
          ">

            <div>
              <p style="
              font-size:0.7rem;
              color:var(--text-muted);
              margin:0;
              ">
              CURRENT BID
              </p>

              <p style="
              font-size:1.1rem;
              font-weight:800;
              color:var(--primary-color);
              margin:0;
              ">
              ₹${highestBid ? highestBid.amount : p.minPrice}
              </p>
            </div>

            <button
            class="btn btn-outline"
            style="
            padding:0.3rem 0.6rem;
            font-size:0.75rem;
            "
            onclick='openDetails(${JSON.stringify(p)})'>
            Details
            </button>

          </div>

          <button
          class="btn btn-primary"
          style="
          width:100%;
          justify-content:center;
          padding:0.8rem;
          "
          onclick='openBidModal(
  ${p.id},
  ${p.farmerId},
  ${JSON.stringify(p.farmerName)},
  ${JSON.stringify(p.name)},
  ${p.minPrice},
  ${p.maxPrice}
)'>

          Place Bid

          </button>

        </div>

      </div>
      `;
          })
          .join("");
      }

      // ===============================
      // DETAILS MODAL (NEW)
      // ===============================
      function openDetails(p) {
        document.getElementById("detail-name").innerText = p.name;
        document.getElementById("detail-image").src = p.image;

        document.getElementById("detail-farmer").innerText =
          "👨‍🌾 Farmer: " + p.farmerName;

        document.getElementById("detail-location").innerText =
          "📍 Location: " + p.location;

        document.getElementById("detail-category").innerText =
          "📦 Category: " + p.category;

        document.getElementById("detail-quantity").innerText =
          "⚖️ Quantity: " + p.quantity + " " + p.unit;

        document.getElementById("detail-price").innerText =
          "💰 Minimum Price: ₹" + p.minPrice;

        document.getElementById("details-modal").classList.add("active");
      }

      function closeDetails() {
        document.getElementById("details-modal").classList.remove("active");
      }

      // ===============================
      // SEARCH
      // ===============================

      const searchInput = document.querySelector(".search-bar input");

      const searchBtn = document.querySelector(".search-bar .btn-primary");

      const categorySelect = document.querySelector(".search-bar select");

      function performSearch() {
        renderMarketplace(searchInput.value, categorySelect.value);
      }

      searchBtn.addEventListener("click", performSearch);

      searchInput.addEventListener("keyup", (e) => {
        if (e.key === "Enter") {
          performSearch();
        }
      });

      categorySelect.addEventListener("change", performSearch);

      // ===============================
      // BID FORM SUBMIT
      // ===============================

      document.getElementById("bid-form").addEventListener("submit", (e) => {
        e.preventDefault();

        const user = State.getCurrentUser();
        if (!user) {
          UI.showToast("Please login to place a bid", "error");
          return;
        }

        const amount = parseInt(document.getElementById("bid-amount").value);

        const productId = parseInt(
          document.getElementById("bid-product-id").value,
        );

        const product = State.getProducts().find((p) => p.id === productId);
        const quantity = product ? product.quantity : 1;

        const highestBid = State.getHighestBid(productId);

        if (highestBid && amount <= highestBid.amount) {
          UI.showToast(
            `Your bid must be higher than ₹${highestBid.amount}`,
            "error",
          );

          return;
        }

        const maxPrice =
          Number(document.getElementById("bid-max-price").value) || null;
        if (maxPrice && amount > maxPrice) {
          UI.showToast(
            `Your bid cannot exceed the maximum price of ₹${maxPrice}`,
            "error",
          );
          return;
        }

        const bid = {
          productId: productId,
          productName: document.getElementById("bid-product-name").value,

          farmerId: parseInt(document.getElementById("bid-farmer-id").value),

          farmerName: document.getElementById("bid-farmer-name").value,

          vendorId: user.id,
          vendorName: user.name,
          amount: amount,
          quantity: quantity,
        };

        State.placeBid(bid);

        closeBidModal();

        UI.showToast(
          highestBid ? "Bid Updated Successfully!" : "Bid Placed Successfully!",
          "success",
        );

        renderMarketplace(searchInput.value, categorySelect.value);
      });

      // ===============================
      // PAGE LOAD
      // ===============================

      State.listenToChanges(performSearch);

      document.addEventListener("DOMContentLoaded", () => {
        renderMarketplace();
      });
    </script>
  </body>
</html>
